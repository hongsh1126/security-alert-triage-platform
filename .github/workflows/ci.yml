name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . scikit-learn joblib
      - run: python -m unittest discover -s tests -v
      - run: python llm/fine_tune_lora.py --validate-only
      - run: python aws/launch_training.py --dry-run

