[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "security-alert-triage"
version = "0.1.0"
description = "Production-oriented security alert triage with LoRA, SageMaker, API, and analyst feedback"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["triage*"]

